<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HACKER WHATSAPP - FULL</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{height:100vh;background:#000 url('bg.jpg') center/cover no-repeat fixed;display:flex;justify-content:center;overflow:hidden}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.70);z-index:0}
.app{position:relative;z-index:1;width:100%;max-width:450px;height:100vh;background:rgba(11,20,26,.88);display:flex;flex-direction:column}
#loginScreen{position:absolute;inset:0;z-index:99;background:rgba(11,20,26,.97) url('bg.jpg') center/cover no-repeat;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px}
#loginScreen::after{content:'';position:absolute;inset:0;background:rgba(11,20,26,.92);z-index:-1}
#loginScreen h1{color:#00ff88;font-size:28px;margin-bottom:20px;z-index:1}
#keySetup{display:none;flex-direction:column;gap:10px;z-index:1;width:100%;max-width:300px}
#keySetup input{padding:12px;border-radius:10px;border:1px solid #00ff88;background:#2a3942;color:#fff;outline:none;text-align:center}
#keySetup button{padding:12px;border-radius:10px;border:none;background:#00ff88;color:#000;font-weight:700;cursor:pointer}
.user-cards{display:flex;gap:20px;z-index:1}
.card{width:135px;height:155px;background:rgba(32,44,51,.9);border:2px solid #2a3942;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
.header{height:60px;background:rgba(32,44,51,.95);padding:0 16px;display:flex;align-items:center;justify-content:space-between;color:#e9edef}
#pinnedBar{display:none;background:rgba(24,34,38,.95);border-left:4px solid #00ff88;padding:8px 12px;color:#e9edef;font-size:12px}
.messages{flex:1;overflow:auto;padding:12px 10px;display:flex;flex-direction:column;gap:6px}
.bubble{max-width:78%;padding:6px 8px 4px;border-radius:8px;font-size:13.5px;position:relative;word-break:break-word;cursor:pointer;user-select:none}
.me{align-self:flex-start;background:rgba(0,92,75,.92);color:#e9edef;border-top-left-radius:0}
.other{align-self:flex-end;background:rgba(32,44,51,.92);color:#e9edef;border-top-right-radius:0}
.bubble.encrypted{border:1.5px solid #00ff88;box-shadow:0 0 12px rgba(0,255,136,.4)}
.bubble.selected{outline:2px solid #00ff88}
.reply-box{background:rgba(0,0,0,.4);border-left:3px solid #00ff88;padding:4px 6px;border-radius:4px;margin-bottom:4px;font-size:11px}
.meta{display:flex;justify-content:flex-end;gap:4px;margin-top:3px}.time{font-size:10px;color:#8696a0}.ticks.read{color:#53bdeb}
.react{position:absolute;bottom:-10px;right:6px;background:#2a3942;border-radius:12px;padding:1px 6px;font-size:12px}
#replyPreview{display:none;background:#182229;border-left:4px solid #00ff88;padding:8px 12px;position:relative}
#replyPreview b{color:#00ff88;font-size:12px;display:block}
#closeReply{position:absolute;right:10px;top:50%;transform:translateY(-50%);cursor:pointer}
#ctxMenu{position:fixed;z-index:200;display:none;background:#233138;border-radius:14px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.8);width:270px}
#emojiBar{display:flex;justify-content:space-around;padding:12px;background:#182229;border-bottom:1px solid #2a3942}
#emojiBar span{font-size:24px;cursor:pointer;padding:4px}
.ctxItem{padding:14px 16px;display:flex;gap:12px;color:#e9edef;font-size:14px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.05)}
.ctxItem:last-child{border:none}
.ctxItem:hover{background:#2a3942}
.input-area{padding:6px 8px;background:rgba(32,44,51,.95);display:flex;gap:6px;align-items:center}
.input-box{flex:1;background:#2a3942;border-radius:22px;display:flex;padding:6px 12px;align-items:center}
.input-box input{flex:1;background:transparent;border:none;outline:none;color:#e9edef;padding:8px 0}
#encBtn,#keyBtn,#voiceBtn,#sendBtn{width:44px;height:44px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
#encBtn{background:#2a3942;color:#00ff88;border:1px solid #2a3942}#encBtn.active{background:#00ff88;color:#000;box-shadow:0 0 15px #00ff88}
#keyBtn{background:#2a3942;color:#ffaa00}
#voiceBtn,#sendBtn{background:#00a884;color:white}#sendBtn{display:none}
#encHint{display:none;background:#00ff88;color:#000;text-align:center;font-size:11px;padding:5px;font-weight:700}
#typingIndicator{display:none;padding:6px 16px;font-size:12px;color:#00ff88;background:rgba(0,0,0,.3)}
</style>
</head>
<body>
<div class="overlay"></div>
<div class="app">
<div id="loginScreen"><h1 id="loginTitle">WHO ARE YOU?</h1>
<div id="userSelect" class="user-cards"><div class="card" onclick="login('كريم')"><div style="width:70px;height:70px;border-radius:50%;background:#00a884;display:flex;align-items:center;justify-content:center;font-size:30px;color:white;margin-bottom:10px">K</div><b>كريم</b></div><div class="card" onclick="login('احمد')"><div style="width:70px;height:70px;border-radius:50%;background:#54656f;display:flex;align-items:center;justify-content:center;font-size:30px;color:white;margin-bottom:10px">A</div><b>احمد</b></div></div>
<div id="keySetup"><h3 style="color:#00ff88;text-align:center">🔐 المفتاح السري</h3><p style="color:#8696a0;font-size:12px;text-align:center">لازم انت واحمد نفس المفتاح</p><input id="keyInput" type="password" placeholder="اكتب المفتاح"><button onclick="saveKey()">حفظ ودخول 🔓</button></div>
</div>
<div class="header"><div><div style="font-weight:700">HACKER CHAT 🔐 AES</div><small id="statusText">مفتاح: <span id="keyStatus">لم يحدد</span></small></div><div style="display:flex;gap:6px"><b id="meName" style="color:#00ff88"></b><button onclick="changeKey()" style="background:#2a3942;border:none;color:#ffaa00;width:30px;height:30px;border-radius:50%">🔑</button></div></div>
<div id="pinnedBar"><b>📌 مثبتة</b> <span id="pinnedText"></span> <span onclick="unpin()" style="float:right;cursor:pointer">✖</span></div>
<div class="messages" id="msgs"></div>
<div id="typingIndicator"></div>
<div id="replyPreview"><b id="replyWho"></b><span id="replyText"></span><span id="closeReply" onclick="cancelReply()">✖</span></div>
<div class="input-area"><button id="keyBtn" onclick="changeKey()">🔑</button><button id="encBtn">🔒</button><div class="input-box"><input id="txt" placeholder="Message"></div><button id="voiceBtn">🎙️</button><button id="sendBtn">➤</button></div>
<div id="encHint">🔐 AES-256 شغال - الرسالة هتتشفر</div>
</div>

<div id="ctxMenu">
<div id="emojiBar"><span onclick="react('❤️')">❤️</span><span onclick="react('😂')">😂</span><span onclick="react('😮')">😮</span><span onclick="react('😢')">😢</span><span onclick="react('🙏')">🙏</span><span onclick="react('🔥')">🔥</span></div>
<div class="ctxItem" onclick="doReply()">↩️ رد</div>
<div class="ctxItem" onclick="doCopy()">📋 نسخ النص</div>
<div class="ctxItem" id="decryptOption" onclick="doDecrypt()" style="display:none;color:#00ff88;font-weight:700;border:1px dashed #00ff88;margin:4px;border-radius:8px">🔓 فك التشفير AES</div>
<div class="ctxItem" onclick="doForward()">↪️ إعادة توجيه</div>
<div class="ctxItem" onclick="doPin()">📌 تثبيت الرسالة</div>
<div class="ctxItem" onclick="doDelete()" style="color:#f15c6d">🗑️ مسح الرسالة</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, push, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
const firebaseConfig = { apiKey: "AIzaSyDy6eUDmAAdSN9aYq6kbcBPVvIRqhPmz50", authDomain: "hack1-cb0f2.firebaseapp.com", databaseURL: "https://hack1-cb0f2-default-rtdb.firebaseio.com", projectId: "hack1-cb0f2", storageBucket: "hack1-cb0f2.firebasestorage.app", messagingSenderId: "926645598259", appId: "1:926645598259:web:eabe7d3f588ee0b26f0b46" };
const appFB=initializeApp(firebaseConfig); const db=getDatabase(appFB);
const chatRef=ref(db,'hacker_ultra_blue'); const pinRef=ref(db,'hacker_pinned_blue'); const typingRef=ref(db,'typing_status');
let myName=localStorage.getItem('hacker_name'); let secretKey=localStorage.getItem('hacker_secret_key');
const loginScreen=document.getElementById('loginScreen'), userSelect=document.getElementById('userSelect'), keySetup=document.getElementById('keySetup'), loginTitle=document.getElementById('loginTitle');
function updateKeyStatus(){document.getElementById('keyStatus').innerText=secretKey?'✅ '+secretKey.slice(0,4)+'***':'❌';}
window.login=(n)=>{myName=n; localStorage.setItem('hacker_name',n); if(!secretKey){userSelect.style.display='none';keySetup.style.display='flex';loginTitle.innerText='🔐 حدد المفتاح';}else{loginScreen.style.display='none';document.getElementById('meName').innerText=n;updateKeyStatus();initChat();}}
window.saveKey=()=>{let k=document.getElementById('keyInput').value.trim();if(!k){alert('اكتب المفتاح');return;}secretKey=k;localStorage.setItem('hacker_secret_key',k);loginScreen.style.display='none';document.getElementById('meName').innerText=myName;updateKeyStatus();initChat();}
window.changeKey=()=>{let newK=prompt('المفتاح السري الجديد:',secretKey||'');if(newK){secretKey=newK;localStorage.setItem('hacker_secret_key',newK);updateKeyStatus();}}
window.logout=()=>{localStorage.removeItem('hacker_name'); location.reload();}
if(myName){if(!secretKey){userSelect.style.display='none';keySetup.style.display='flex';loginTitle.innerText='🔐 حدد المفتاح';}else{loginScreen.style.display='none';document.getElementById('meName').innerText=myName;updateKeyStatus();}}
function encryptAES(t){return "🔐AES::"+CryptoJS.AES.encrypt(t,secretKey).toString();}
function decryptAES(c){try{let raw=c.replace("🔐AES::","").replace("🔐ENC::","");let bytes=CryptoJS.AES.decrypt(raw,secretKey);let plain=bytes.toString(CryptoJS.enc.Utf8);if(!plain)throw "wrong";return plain;}catch{return null;}}
function isAES(t){return t&&(t.startsWith("🔐AES::")||t.startsWith("🔐ENC::"));}
let selectedKey=null,selectedData=null,selectedEl=null,encMode=false,replyData=null;
const encBtn=document.getElementById('encBtn'),encHint=document.getElementById('encHint'),txt=document.getElementById('txt'),msgsDiv=document.getElementById('msgs'),ctxMenu=document.getElementById('ctxMenu'),replyPreview=document.getElementById('replyPreview'),typingIndicator=document.getElementById('typingIndicator'),statusText=document.getElementById('statusText');
encBtn.onclick=()=>{if(!secretKey){changeKey();return;}encMode=!encMode;encBtn.classList.toggle('active',encMode);encBtn.innerText=encMode?'🔓':'🔒';encHint.style.display=encMode?'block':'none';txt.placeholder=encMode?'🔐 اكتب سري...':'Message';txt.style.color=encMode?'#00ff88':'#e9edef';txt.focus();};
function initChat(){
let typingTimeout=null;
txt.addEventListener('input',()=>{const vBtn=document.getElementById('voiceBtn'),sBtn=document.getElementById('sendBtn');if(txt.value.trim()){vBtn.style.display='none';sBtn.style.display='flex';}else{vBtn.style.display='flex';sBtn.style.display='none';}update(typingRef,{[myName]:true});clearTimeout(typingTimeout);typingTimeout=setTimeout(()=>update(typingRef,{[myName]:false}),1500);});
onValue(typingRef,(snap)=>{const data=snap.val()||{};const other=myName==='كريم'?'احمد':'كريم';if(data[other]){typingIndicator.style.display='block';typingIndicator.innerText=`${other} يكتب الآن... ✍️`; }else{typingIndicator.style.display='none';}});
onValue(chatRef,(snap)=>{msgsDiv.innerHTML='';let updates={};snap.forEach(child=>{const d=child.val(),key=child.key;if(d.who!==myName && (!d.readBy||!d.readBy.includes(myName))){let newReadBy=d.readBy?[...d.readBy,myName]:[myName];updates[`${key}/readBy`]=newReadBy;updates[`${key}/status`]='read';}const timeStr=d.time?new Date(d.time).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'';let tick='',tickClass='';if(d.who===myName){if(d.status==='read'||(d.readBy&&d.readBy.length>0)){tick='✓✓';tickClass='read';}else{tick='✓✓';} if(!d.readBy||d.readBy.length===0)tick='✓';}const div=document.createElement('div');let extra='';if(isAES(d.text)&&!d.wasDecrypted)extra=' encrypted';if(d.wasDecrypted)extra=' decrypted';div.className='bubble '+(d.who===myName?'me':'other')+extra;let display=d.text;if(isAES(d.text)&&!d.wasDecrypted){display=`🔒 <b>AES-256</b> رسالة مشفرة<br><small style="font-size:9px;opacity:.6">دوسة طويلة لفكها</small><br><code style="font-size:8px;opacity:.3;word-break:break-all">${d.text.slice(0,30)}...</code>`;}else if(d.wasDecrypted){display=`🔓 ${d.text}<br><small style="font-size:9px;color:#ffaa00">✓ تم فكها</small>`;}let replyHTML=d.reply?`<div class="reply-box"><i>${d.reply.who}</i>${d.reply.text.slice(0,60)}</div>` : '';div.innerHTML=`${replyHTML}<b>${d.who} ${isAES(d.text)&&!d.wasDecrypted?'🔐':''}</b>${display}<div class="meta"><span class="time">${timeStr}</span>${d.who===myName?`<span class="ticks ${tickClass}">${tick}</span>`:''}</div>${d.reaction?`<div class="react">${d.reaction}</div>`:''}`;div.addEventListener('contextmenu',(e)=>{e.preventDefault();openMenu(e,key,d,div);});let touchTimer;div.addEventListener('touchstart',(e)=>{touchTimer=setTimeout(()=>openMenu(e,key,d,div),600);},{passive:false});div.addEventListener('touchend',()=>clearTimeout(touchTimer));div.addEventListener('touchmove',()=>clearTimeout(touchTimer));div.addEventListener('mousedown',(e)=>{touchTimer=setTimeout(()=>openMenu(e,key,d,div),600);});div.addEventListener('mouseup',()=>clearTimeout(touchTimer));msgsDiv.appendChild(div);});if(Object.keys(updates).length>0)update(chatRef,updates);msgsDiv.scrollTop=msgsDiv.scrollHeight;});
onValue(pinRef,(s)=>{const v=s.val();if(v){document.getElementById('pinnedBar').style.display='block';document.getElementById('pinnedText').innerText=v.text.slice(0,60);}else{document.getElementById('pinnedBar').style.display='none';}});
const sendBtn=document.getElementById('sendBtn');
function sendText(){if(!txt.value.trim())return;let finalText=txt.value;if(encMode){let enc=encryptAES(txt.value);if(!enc)return;finalText=enc;}let payload={who:myName,text:finalText,time:Date.now(),status:'sent',readBy:[],wasDecrypted:false};if(replyData)payload.reply={who:replyData.who,text:replyData.text};push(chatRef,payload);update(typingRef,{[myName]:false});txt.value='';cancelReply();document.getElementById('voiceBtn').style.display='flex';sendBtn.style.display='none';if(encMode){encMode=false;encBtn.classList.remove('active');encBtn.innerText='🔒';encHint.style.display='none';txt.placeholder='Message';txt.style.color='#e9edef';}}
sendBtn.onclick=sendText;txt.addEventListener('keydown',e=>{if(e.key==='Enter')sendText();});
}
function openMenu(e,key,data,el){
e.preventDefault();selectedKey=key;selectedData=data;selectedEl=el;
document.querySelectorAll('.bubble').forEach(b=>b.classList.remove('selected')); if(el)el.classList.add('selected');
ctxMenu.style.display='block';
const decryptOpt=document.getElementById('decryptOption');
// يظهر فك التشفير بس لو متشفرة
if(isAES(data.text) &&!data.wasDecrypted){decryptOpt.style.display='flex';}else{decryptOpt.style.display='none';}
let x=e.touches?e.touches[0].clientX:e.clientX; let y=e.touches?e.touches[0].clientY:e.clientY;
ctxMenu.style.left=Math.min(x, window.innerWidth-280)+'px';
ctxMenu.style.top=Math.min(y, window.innerHeight-350)+'px';
}
window.addEventListener('click',(e)=>{if(!ctxMenu.contains(e.target)){ctxMenu.style.display='none';document.querySelectorAll('.bubble').forEach(b=>b.classList.remove('selected'));}});
window.cancelReply=()=>{replyData=null;replyPreview.style.display='none';};
window.doReply=()=>{replyData={who:selectedData.who,text:selectedData.text};document.getElementById('replyWho').innerText=selectedData.who;document.getElementById('replyText').innerText=selectedData.text.slice(0,80);replyPreview.style.display='block';ctxMenu.style.display='none';document.getElementById('txt').focus();};
window.react=(emoji)=>{update(ref(db,`hacker_ultra_blue/${selectedKey}`),{reaction:emoji});ctxMenu.style.display='none';};
window.doCopy=()=>{let t=selectedData.text; if(isAES(t)&&!selectedData.wasDecrypted){alert('الرسالة متشفرة - فكها الاول عشان تنسخها');}else{navigator.clipboard.writeText(t);}ctxMenu.style.display='none';};
window.doForward=()=>{let t=selectedData.text;push(chatRef,{who:myName,text:t,time:Date.now(),status:'sent',readBy:[],wasDecrypted:selectedData.wasDecrypted||false});ctxMenu.style.display='none';};
window.doPin=()=>{update(pinRef,{text:selectedData.text,who:selectedData.who});ctxMenu.style.display='none';};
window.unpin=()=>remove(pinRef);
window.doDelete=()=>{if(confirm('مسح الرسالة؟'))remove(ref(db,`hacker_ultra_blue/${selectedKey}`));ctxMenu.style.display='none';};
window.doDecrypt=()=>{let plain=decryptAES(selectedData.text);if(!plain){alert('❌ المفتاح غلط! لازم نفس المفتاح عندكم انتو الاتنين');return;}update(ref(db,`hacker_ultra_blue/${selectedKey}`),{text:plain,wasDecrypted:true,originalCipher:selectedData.text});ctxMenu.style.display='none';};
if(myName&&secretKey)initChat();
</script>
</body>
</html>
