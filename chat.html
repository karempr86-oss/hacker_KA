<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHAT - AES</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif}
body{height:100vh;background:#000 url('bg.jpg') center/cover no-repeat fixed;display:flex;justify-content:center;overflow:hidden}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:0}
.app{position:relative;z-index:1;width:100%;max-width:450px;height:100vh;background:rgba(11,20,26,.9);display:flex;flex-direction:column}
#login{position:absolute;inset:0;z-index:99;background:rgba(11,20,26,.97) url('bg.jpg') center/cover no-repeat;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px}
#login::after{content:'';position:absolute;inset:0;background:rgba(11,20,26,.92);z-index:-1}
#login h1{color:#00ff88;font-size:26px;margin-bottom:20px;z-index:1}
#keyBox{display:none;flex-direction:column;gap:10px;z-index:1;width:100%;max-width:300px}
#keyBox input{padding:12px;border-radius:10px;border:1px solid #00ff88;background:#2a3942;color:#fff;outline:none;text-align:center}
#keyBox button{padding:12px;border-radius:10px;border:none;background:#00ff88;color:#000;font-weight:700;cursor:pointer}
.cards{display:flex;gap:20px;z-index:1}
.card{width:130px;height:150px;background:rgba(32,44,51,.9);border:2px solid #2a3942;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
.header{height:60px;background:rgba(32,44,51,.95);padding:0 14px;display:flex;align-items:center;justify-content:space-between;color:#e9edef}
#msgs{flex:1;overflow:auto;padding:12px 10px;display:flex;flex-direction:column;gap:6px}
.bubble{max-width:78%;padding:7px 9px 5px;border-radius:10px;font-size:13.5px;position:relative;word-break:break-word;user-select:none;cursor:pointer}
.me{align-self:flex-start;background:#005c4b;color:#fff;border-top-left-radius:0}
.other{align-self:flex-end;background:#202c33;color:#fff;border-top-right-radius:0}
.bubble.enc{border:1.5px solid #00ff88;box-shadow:0 0 10px rgba(0,255,136,.4)}
.bubble.sel{outline:2px solid #00ff88}
.meta{display:flex;justify-content:flex-end;gap:4px;margin-top:4px}.time{font-size:10px;color:#8696a0}
#ctx{position:fixed;z-index:999;display:none;background:#233138;border-radius:14px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.8);width:270px}
#emo{display:flex;justify-content:space-around;padding:10px;background:#182229;border-bottom:1px solid #2a3942}
#emo span{font-size:22px;cursor:pointer}
.item{padding:13px 16px;display:flex;gap:10px;color:#e9edef;font-size:14px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.05)}
.item:hover{background:#2a3942}
#replyPrev{display:none;background:#182229;border-right:4px solid #00ff88;padding:8px 12px}
.input{padding:6px 8px;background:#202c33;display:flex;gap:6px;align-items:center}
.box{flex:1;background:#2a3942;border-radius:22px;display:flex;padding:6px 12px;align-items:center}
.box input{flex:1;background:transparent;border:none;outline:none;color:#fff;padding:8px 0}
#encBtn,#keyBtn,#sBtn,#vBtn{width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px}
#encBtn{background:#2a3942;color:#00ff88}#encBtn.on{background:#00ff88;color:#000;box-shadow:0 0 15px #00ff88}
#keyBtn{background:#2a3942;color:#ffaa00}
#vBtn,#sBtn{background:#00a884;color:#fff}#sBtn{display:none}
#hint{display:none;background:#00ff88;color:#000;text-align:center;font-size:11px;padding:4px;font-weight:700}
</style>
</head>
<body>
<div class="overlay"></div>
<div class="app">
<div id="login">
<h1 id="t">WHO ARE YOU?</h1>
<div id="sel" class="cards"><div class="card" onclick="log('كريم')"><div style="width:70px;height:70px;border-radius:50%;background:#00a884;display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff;margin-bottom:8px">K</div><b>كريم</b></div><div class="card" onclick="log('احمد')"><div style="width:70px;height:70px;border-radius:50%;background:#54656f;display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff;margin-bottom:8px">A</div><b>احمد</b></div></div>
<div id="keyBox"><h3 style="color:#00ff88;text-align:center">🔐 المفتاح السري</h3><input id="kIn" type="password" placeholder="نفس المفتاح عندكم"><button onclick="saveK()">دخول 🔓</button></div>
</div>
<div class="header"><div><b>HACKER CHAT</b><br><small style="color:#00ff88;font-size:10px">مفتاح: <span id="kSt">--</span></small></div><div style="display:flex;gap:6px"><b id="myN" style="color:#00ff88"></b><button onclick="chgK()" style="background:#2a3942;border:none;color:#ffaa00;width:30px;height:30px;border-radius:50%">🔑</button></div></div>
<div id="msgs"></div>
<div id="replyPrev"><b id="rWho" style="color:#00ff88;font-size:12px"></b><span id="rTx" style="font-size:12px;color:#8696a0"></span><span onclick="cReply()" style="float:left;cursor:pointer">✖</span></div>
<div class="input"><button id="keyBtn" onclick="chgK()">🔑</button><button id="encBtn">🔒</button><div class="box"><input id="txt" placeholder="Message"></div><button id="vBtn">🎙️</button><button id="sBtn">➤</button></div>
<div id="hint">🔐 وضع التشفير AES شغال</div>
</div>

<div id="ctx">
<div id="emo"><span onclick="react('❤️')">❤️</span><span onclick="react('😂')">😂</span><span onclick="react('😮')">😮</span><span onclick="react('😢')">😢</span><span onclick="react('🙏')">🙏</span><span onclick="react('🔥')">🔥</span></div>
<div class="item" onclick="doReply()">↩️ رد</div>
<div class="item" onclick="doCopy()">📋 نسخ</div>
<div class="item" id="dec" onclick="doDec()" style="display:none;color:#00ff88;font-weight:700;background:rgba(0,255,136,.1);margin:4px;border-radius:8px;border:1px dashed #00ff88">🔓 فك التشفير</div>
<div class="item" onclick="doFwd()">↪️ اعادة توجيه</div>
<div class="item" onclick="doPin()">📌 تثبيت</div>
<div class="item" onclick="doDel()" style="color:#f15c6d">🗑️ مسح</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, push, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
const firebaseConfig = { apiKey: "AIzaSyDy6eUDmAAdSN9aYq6kbcBPVvIRqhPmz50", authDomain: "hack1-cb0f2.firebaseapp.com", databaseURL: "https://hack1-cb0f2-default-rtdb.firebaseio.com", projectId: "hack1-cb0f2", storageBucket: "hack1-cb0f2.firebasestorage.app", messagingSenderId: "926645598259", appId: "1:926645598259:web:eabe7d3f588ee0b26f0b46" };
const appFB=initializeApp(firebaseConfig); const db=getDatabase(appFB);
const chatRef=ref(db,'hacker_ultra_blue');
let myName=localStorage.getItem('hacker_name'); let sKey=localStorage.getItem('hacker_secret_key');
const login=document.getElementById('login'), sel=document.getElementById('sel'), keyBox=document.getElementById('keyBox'), t=document.getElementById('t');
function kSt(){document.getElementById('kSt').innerText=sKey? sKey.slice(0,3)+'***' : 'لم يحدد';}
window.log=(n)=>{myName=n; localStorage.setItem('hacker_name',n); if(!sKey){sel.style.display='none';keyBox.style.display='flex';t.innerText='🔐 المفتاح السري';}else{login.style.display='none';document.getElementById('myN').innerText=n;kSt();init();}}
window.saveK=()=>{let k=document.getElementById('kIn').value.trim();if(!k)return alert('اكتب المفتاح');sKey=k;localStorage.setItem('hacker_secret_key',k);login.style.display='none';document.getElementById('myN').innerText=myName;kSt();init();}
window.chgK=()=>{let nk=prompt('المفتاح الجديد:',sKey||'');if(nk){sKey=nk;localStorage.setItem('hacker_secret_key',nk);kSt();}}
if(myName){if(!sKey){sel.style.display='none';keyBox.style.display='flex';t.innerText='🔐 المفتاح السري';}else{login.style.display='none';document.getElementById('myN').innerText=myName;kSt();}}
function enc(t){return "🔐AES::"+CryptoJS.AES.encrypt(t,sKey).toString();}
function dec(c){try{let r=c.replace("🔐AES::","").replace("🔐ENC::","");let b=CryptoJS.AES.decrypt(r,sKey);let p=b.toString(CryptoJS.enc.Utf8);if(!p)throw 0;return p;}catch{return null;}}
function isEnc(x){return x&&(x.startsWith("🔐AES::")||x.startsWith("🔐ENC::"));}
let selK=null, selD=null, encMode=false, repD=null;
const encBtn=document.getElementById('encBtn'), hint=document.getElementById('hint'), txt=document.getElementById('txt'), msgs=document.getElementById('msgs'), ctx=document.getElementById('ctx');
encBtn.onclick=()=>{if(!sKey){chgK();return;}encMode=!encMode;encBtn.classList.toggle('on',encMode);encBtn.innerText=encMode?'🔓':'🔒';hint.style.display=encMode?'block':'none';txt.placeholder=encMode?'🔐 كلام سري...':'Message';txt.style.color=encMode?'#00ff88':'#fff';txt.focus();};
function init(){
onValue(chatRef,(snap)=>{msgs.innerHTML='';snap.forEach(ch=>{const d=ch.val(),key=ch.key;const time=d.time?new Date(d.time).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'';const div=document.createElement('div');let ex='';if(isEnc(d.text)&&!d.dec)ex=' enc';div.className='bubble '+(d.who===myName?'me':'other')+ex;let show=d.text;if(isEnc(d.text)&&!d.dec){show=`🔒 <b>AES مشفر</b><br><small style="font-size:9px">دوسة طويلة لفكها</small>`;}else if(d.dec){show=`🔓 ${d.text}`;}let rp=d.reply?`<div style="background:rgba(0,0,0,.3);border-right:3px solid #00ff88;padding:4px 6px;border-radius:4px;margin-bottom:4px;font-size:11px">${d.reply.who}: ${d.reply.text.slice(0,50)}</div>`:'';div.innerHTML=`${rp}<b style="font-size:10px">${d.who}</b><div>${show}</div><div class="meta"><span class="time">${time}</span></div>${d.reaction?`<div style="position:absolute;bottom:-8px;right:6px;background:#2a3942;border-radius:10px;padding:1px 5px;font-size:11px">${d.reaction}</div>`:''}`;let tm;div.addEventListener('touchstart',(e)=>{tm=setTimeout(()=>openM(e,key,d,div),550);},{passive:true});div.addEventListener('touchend',()=>clearTimeout(tm));div.addEventListener('contextmenu',(e)=>{e.preventDefault();openM(e,key,d,div);});msgs.appendChild(div);});msgs.scrollTop=msgs.scrollHeight;});
const sBtn=document.getElementById('sBtn'),vBtn=document.getElementById('vBtn');
txt.addEventListener('input',()=>{if(txt.value.trim()){vBtn.style.display='none';sBtn.style.display='flex';}else{vBtn.style.display='flex';sBtn.style.display='none';}});
function send(){if(!txt.value.trim())return;let f=txt.value;if(encMode){f=enc(txt.value);}let p={who:myName,text:f,time:Date.now(),dec:false};if(repD)p.reply={who:repD.who,text:repD.text};push(chatRef,p);txt.value='';cReply();vBtn.style.display='flex';sBtn.style.display='none';if(encMode){encMode=false;encBtn.classList.remove('on');encBtn.innerText='🔒';hint.style.display='none';}}
sBtn.onclick=send; txt.addEventListener('keydown',e=>{if(e.key==='Enter')send();});
}
function openM(e,key,data,el){e.preventDefault();selK=key;selD=data;document.querySelectorAll('.bubble').forEach(b=>b.classList.remove('sel'));if(el)el.classList.add('sel');ctx.style.display='block';document.getElementById('dec').style.display=(isEnc(data.text)&&!data.dec)?'flex':'none';let x=e.touches?e.touches[0].clientX:e.clientX;let y=e.touches?e.touches[0].clientY:e.clientY;ctx.style.left=Math.min(x,window.innerWidth-280)+'px';ctx.style.top=Math.min(y,window.innerHeight-360)+'px';}
window.addEventListener('click',(e)=>{if(!ctx.contains(e.target))ctx.style.display='none';});
window.cReply=()=>{repD=null;document.getElementById('replyPrev').style.display='none';};
window.doReply=()=>{repD={who:selD.who,text:selD.text};document.getElementById('rWho').innerText=selD.who;document.getElementById('rTx').innerText=selD.text.slice(0,70);document.getElementById('replyPrev').style.display='block';ctx.style.display='none';txt.focus();};
window.react=(em)=>{update(ref(db,`hacker_ultra_blue/${selK}`),{reaction:em});ctx.style.display='none';};
window.doCopy=()=>{if(isEnc(selD.text)&&!selD.dec){alert('فك التشفير الاول');}else{navigator.clipboard.writeText(selD.text);}ctx.style.display='none';};
window.doFwd=()=>{push(chatRef,{who:myName,text:selD.text,time:Date.now(),dec:selD.dec||false});ctx.style.display='none';};
window.doPin=()=>{alert('تم تثبيت: '+selD.text.slice(0,30));ctx.style.display='none';};
window.doDel=()=>{if(confirm('مسح؟'))remove(ref(db,`hacker_ultra_blue/${selK}`));ctx.style.display='none';};
window.doDec=()=>{let p=dec(selD.text);if(!p){alert('❌ المفتاح غلط');return;}update(ref(db,`hacker_ultra_blue/${selK}`),{text:p,dec:true});ctx.style.display='none';};
if(myName&&sKey)init();
</script>
</body>
</html>
