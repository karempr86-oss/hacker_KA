<!doctype html>
<html lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HACKER CHAT - LOGIN</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Courier New", monospace;
      }
      body {
        height: 100vh;
        background: url("bg.jpg") center/cover;
        display: grid;
        place-items: center;
        position: relative;
      }
      body::after {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.85);
        backdrop-filter: blur(2px);
      }
      .box {
        position: relative;
        z-index: 2;
        width: 90%;
        max-width: 380px;
        background: rgba(10, 12, 16, 0.9);
        border: 1px solid #00ff88;
        border-radius: 16px;
        padding: 28px;
        box-shadow: 0 0 30px rgba(0, 255, 136, 0.2);
      }
      h1 {
        color: #00ff88;
        text-align: center;
        font-size: 28px;
        letter-spacing: 2px;
        text-shadow: 0 0 10px #00ff88;
      }
      p {
        color: #00ff88aa;
        text-align: center;
        font-size: 11px;
        margin: 10px 0 20px;
      }
      input {
        width: 100%;
        background: #000;
        border: 1px solid #00ff8833;
        border-radius: 10px;
        padding: 14px;
        color: #00ff88;
        outline: none;
        margin-top: 10px;
      }
      input:focus {
        border-color: #00ff88;
      }
      button {
        width: 100%;
        margin-top: 16px;
        background: #00ff88;
        color: #000;
        border: none;
        border-radius: 10px;
        padding: 14px;
        font-weight: 900;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>HACKER CHAT</h1>
      <p>SECURE / FIREBASE • ENTER CODE NAME</p>
      <input id="name" placeholder="GHOST_0x13" />
      <button onclick="enter()">[ CONNECT TO SERVER ]</button>
    </div>
    <script>
      function enter() {
        let n =
          document.getElementById("name").value.trim() ||
          "GHOST_" + Math.floor(Math.random() * 999);
        localStorage.setItem("hacker_name", n);
        location.href = "chat.html";
      }
    </script>
  </body>
</html>
